# CCGS project configuration — single source of truth for project settings.
# See .claude/docs/effects-map.md for full schema.

schema_version: 1

framework:
  version: 1.1.3
  last_upgraded: 2026-09-25

project:
  stage: Concept

modes:
  rigor: minimal
  automation: autonomous

engine:
  name: "Godot"
  version: "4.7.2"
  # C# toolchain VERIFIED 2026-10-17 — not merely assumed:
  #   editor  4.7.2.stable.mono.official.ed1daf0bf (.NET build, has GodotSharp/)
  #   sdk     .NET SDK 9.0.318 at C:\Program Files\dotnet
  #   restore Godot.NET.Sdk / GodotSharp / GodotSharpEditor 4.7.2 all resolve
  #   build   `dotnet build` → 0 errors, 0 warnings, DLL produced
  #   gate    a deliberately broken script fails with error CS0103 / exit 1,
  #           so a green build is evidence the .cs was actually compiled in —
  #           not a pass produced by a file that was never read.
  # NOTE: `dotnet` is not on PATH in this shell. Use the full path
  # (C:/Program Files/dotnet/dotnet.exe) or export PATH before shell commands.
  # The .csproj here was hand-written to match what Godot's editor generates;
  # Godot will rewrite it when a C# script is first created in the editor.
  language: "C#"
  rendering: "Forward+"
  physics: "Godot Physics 2D"
  # `path` intentionally omitted — the editor is on PATH (`godot` resolves to
  # C:\Tools\Godot\4.7.2\godot.exe), and the convention is to omit it in that case.
  # If `godot` ever leaves PATH, set this AND the full path into commands.* —
  # engine.path is never spliced into commands at run time.

specialists:
  code: "godot-csharp-specialist"
  shader: "godot-shader-specialist"
  ui: "godot-specialist"
  additional: ["godot-gdextension-specialist"]

naming:
  classes: PascalCase
  variables: camelCase
  constants: PascalCase
  signals: on_event_name
  files: PascalCase
  scenes: PascalCase

commands:
  # Bare `godot` is correct here: `godot --version` ran on 2026-10-17, so the
  # editor IS on PATH (C:\Tools\Godot\4.7.2\godot.exe). Only write a full path
  # when the probe failed to resolve the bare name.
  #
  # build is unset for a different reason: the export preset name is a
  # PROJECT-DEFINED string (whatever you typed in export_presets.cfg), not an
  # engine default. Writing 'Linux/X11' — 4.6's shipped default — gives a
  # Windows-targeting project `Unknown export preset`, or worse, silently
  # builds the wrong platform. No export_presets.cfg exists yet. Set it with
  # /settings once the project exports for Windows.
  build: "[TO BE CONFIGURED]"
  # `test` is the C# path, verified by execution on 2026-10-17:
  #   `dotnet test` exits 0 on pass, 1 on failure, and a deliberately broken
  #   test was confirmed to report 失败 and exit 1. The GDScript runner
  #   (`godot -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd`) is the *GDScript*
  #   integration and does NOT apply — this project is C#.
  # Requires `dotnet` (SDK 9.0.318 @ C:/Program Files/dotnet). It is on the
  # Windows PATH but not always inherited by the shell; prefix with
  #   export PATH="/c/Program Files/dotnet:$PATH"
  # if the command is not found. See tests/README.md.
  test: "dotnet test tests/Claude-Code-Game-Studios.Tests.csproj"
  run: "godot --path . --windowed --resolution 1280x720"
  smoke: "godot --headless --quit-after 5"


# NOTE: this template ships with no `modes:` block, and the six knobs below must
# never be added to one.
#
# `/start` DOES add `modes.rigor` and `modes.automation` here — that is its job,
# and a `modes:` block containing those two is the expected state of a configured
# project, not a mistake.
#
# What must stay absent is the six knobs `modes.rigor` FRONTS:
# `modes.review_mode`, `modes.workflow`, `docs.density`, `qa.level`,
# `modes.story_granularity` and `team.size`. Seeding any of them in this file
# pins that value and shadows the rigor expansion, so `/start` asking "what are
# you building?" would stop changing anything. `/start` Phase 3c documents the
# same rule for the file it writes.
#
# Per-developer preferences belong in `project.local.yaml` (gitignored), not
# here. `/settings --local <key>=<value>` writes there; `/settings <key>=<value>`
# edits this file. See `.claude/docs/config-resolution.md` for the full
# precedence order.
