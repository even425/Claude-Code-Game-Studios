; Godot 导出预设（Windows 桌面版）
;
; **为什么需要它**：`project.yaml` 的 `commands.build` 是 `[TO BE CONFIGURED]`，
; 因为导出预设名是**项目定义的字符串**（不是引擎默认值）——
; 写 4.6 的出厂默认 "Linux/X11" 会让一个 Windows 项目报
; "Unknown export preset"，更糟的是**悄悄导出了错的平台**。
;
; **预设名必须与 `project.yaml` 的 `commands.build` 里那个一致** ——
; 两处不许分叉，由 `ExportPresetTests` 守住。
;
; ⚠️ **导出还需要 Godot 的导出模板**（`Godot_v4.7.2-stable_mono_export_templates.tpz`，
;    约 1.2 GB，装到 `%APPDATA%\Godot\export_templates\4.7.2.stable.mono\`）。
;    模板**不在版本库里**（它是引擎的运行时依赖，不是项目源码）。
;
;    没有模板时导出命令会明确报 "No export template found" ——
;    这与 "Unknown export preset"（**预设名/格式不对**）是**两种不同的错**：
;    前者是环境没准备好，后者是项目配错了。
;    ⇒ `ExportPresetTests` 断言的正是「**不是** Unknown export preset」。

