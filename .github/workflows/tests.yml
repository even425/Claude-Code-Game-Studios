name: Automated Tests

on:
  push:
    branches: [main, mytown]
  pull_request:
    branches: [main, mytown]

jobs:
  test:
    name: Run gdUnit4 (C#)
    runs-on: windows-latest

    # godotengine/godot is NOT used here. This is a C# project: tests run through
    # `dotnet test` against the gdUnit4 NuGet packages, not through the GDScript
    # addon runner. The Godot editor is only needed if game code is built here.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Fails the job on a restore error. Without it, a NU1605 package
      # downgrade (see tests/README.md) surfaces later as a confusing build
      # failure instead of a dependency failure.
      - name: Restore
        run: dotnet restore tests/Claude-Code-Game-Studios.Tests.csproj

      # The game project excludes tests/ via <Compile Remove="tests/**/*.cs" />,
      # so the two assemblies stay separate and a test-only reference cannot
      # break the shipped build.
      - name: Build game assembly
        run: dotnet build Claude-Code-Game-Studios.csproj -c Release

      # The Debug build is NOT optional: Godot headless loads
      # .godot/mono/temp/bin/Debug/, so a Release-only build leaves the
      # headless path running stale code - silently, with no error.
      - name: Build game assembly (Debug, for the headless self-checks)
        run: dotnet build Claude-Code-Game-Studios.csproj

      # The test run AND the empty-suite guard live in one step.
      #
      # ⚠️ Why they were merged: the guard used to be a separate step that ran
      # `dotnet test --list-tests` and grepped for a known test name.
      # gdUnit4 does not implement the VSTest list-tests contract, so that
      # command produced no listing at all — the step threw, and the job went
      # red on a *green* test suite (run #5: "Run tests" succeeded, the guard
      # failed). One run, one verdict.
      #
      # ⚠️ Why the guard greps for a class name and NOT for the summary line:
      # the VSTest console summary is **localised**, and the two locales do not
      # print the same shape. A test **class name**, on the other hand, appears
      # in the output in every locale ("[GdUnit4] Discover: TestSuite
      # FrameworkTests with 1 TestCases found."), so that is what the guard
      # looks for.
      #
      # A run that discovers nothing also exits 0 on some runners — refusing
      # to report that as a pass is the whole point of this guard.
      #
      # ⚠️ Why stderr is NOT merged into stdout here: GitHub's pwsh sets
      # `$ErrorActionPreference = 'Stop'`. `2>&1` turns every line a native
      # command writes to stderr into an **error record**, and 'Stop' then
      # aborts the step on the first one — so the step would fail on dotnet's
      # diagnostics rather than on a test failure (that is what run #7 did).
      # Keep stderr on its own stream; it still shows up in the job log.
      - name: Run tests (and refuse an empty suite)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = dotnet test tests/Claude-Code-Game-Studios.Tests.csproj -c Release --no-restore --logger "console;verbosity=normal" | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($out -notmatch 'FrameworkTests') {
            throw "No tests discovered - refusing to report a pass"
          }
          if ($code -gt 0) { throw "dotnet test failed (exit $code)" }

      # The parameter ledger: every numeric constant in src/ must be claimed,
      # and every parameter's value must match the ledger. A new hardcoded
      # number, a changed value, a stale entry or a document that drifted from
      # the code all fail here.
      - name: Check the parameter ledger against the code
        shell: pwsh
        run: python production/qa/param-inventory.py --check

      # Invariant I9: the rule layer must compile AND run **without Godot**.
      # The main test project references the whole game (hence GodotSharp), so a
      # test there cannot prove this - only a project that does NOT reference
      # Godot can. One `using Godot;` inside src/Domain fails this build, and the
      # program also checks the produced assembly's references at runtime.
      # Separate project on purpose: it has ZERO package references (gdUnit4
      # would drag GodotSharp in transitively and make the gate vacuous).
      - name: Run the rule layer without Godot (invariant I9)
        run: dotnet run --project tests/DomainPurity/DomainPurity.csproj --nologo -v q

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/**/TestResults/

  runtime-selfchecks:
    name: Runtime self-checks (Godot headless)
    runs-on: windows-latest

    # ✅ **这一作业已经在真实 runner 上跑通过一次**（run #5，commit 15b4657：
    # 9 个步骤全部 success，含「Run the runtime self-checks」，耗时 6 分 35 秒）
    # ⇒ 它不再是「探针」，**已经是硬门槛**。
    #
    # 为什么值得单独一个作业：7 个自检开关**只存在于运行中的游戏里**，
    # `dotnet test` 够不到它们 —— 而它们守的正是「玩家存档没被碰」
    # 「结算只发生一次」这类**跑起来才暴露**的问题。
    #
    # ⚠️ 保留 `continue-on-error` 反而更糟：作业红着没人看，
    # 就等于「它其实没在守任何东西，却看起来在守」——
    # 那正是本仓库反复在治的病（工具跑不动 vs 工具跑了没发现问题）。
    # **跑通过一次，就把那条线删掉** —— 这一条已经执行。

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # The .NET ("mono") build is required: this is a C# Godot project.
      # Pinned to the exact engine version the repo pins (4.7.2).
      - name: Install Godot 4.7.2 (.NET build)
        shell: pwsh
        run: |
          $url = "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_win64.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\godot.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\godot.zip" -DestinationPath "$env:RUNNER_TEMP\godot"
          $exe = Get-ChildItem -Path "$env:RUNNER_TEMP\godot" -Recurse -Filter "*.exe" |
                 Where-Object { $_.Name -notlike "*console*" } | Select-Object -First 1
          if (-not $exe) { throw "Godot executable not found in the extracted archive" }
          "GODOT=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Godot: $($exe.FullName)"

      # 首次运行 Godot 会**导入整个项目**（.godot/ 不在版本库里），可能要一会儿。
      # 这一步只做导入，把「导入」与「跑自检」分开 —— 后者的失败才是真问题。
      - name: Import the project (first run creates .godot/)
        shell: pwsh
        run: |
          & $env:GODOT --headless --path . --quit-after 60 2>&1 | Select-Object -Last 20
          if ($LASTEXITCODE -ne 0) { throw "Godot project import failed (exit $LASTEXITCODE)" }

      # Godot headless loads .godot/mono/temp/bin/Debug/ - the Debug build.
      - name: Build game assembly (Release)
        run: dotnet build Claude-Code-Game-Studios.csproj -c Release

      - name: Build game assembly (Debug)
        run: dotnet build Claude-Code-Game-Studios.csproj

      # Godot headless loads .godot/mono/temp/bin/Debug/ - the Debug build.
      # If a csproj change ever redirects the output path, the self-checks
      # below would silently run the wrong assembly (or none at all) and
      # still report a pass. Assert the file is where the engine looks.
      - name: Assert the engine's assembly path is the one we built
        shell: pwsh
        run: |
          $dll = ".godot/mono/temp/bin/Debug/Claude-Code-Game-Studios.dll"
          if (-not (Test-Path $dll)) {
            throw "Debug assembly is not at $dll - Godot headless would load stale code"
          }
          Write-Host "Debug assembly: $dll"

      # --summary writes the per-check table into the job's summary page:
      # a reader sees WHICH check failed without digging through the log,
      # and the failure reasons also go out as check-run annotations
      # (::error::), which are readable through the public API.
      - name: Run the runtime self-checks
        shell: pwsh
        run: python production/qa/run-selfchecks.py --summary "$env:GITHUB_STEP_SUMMARY"
